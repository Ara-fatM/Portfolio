<!Doctype html>
<html lang="en">

<head>
    <title>Movie Night</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="movie.css" />
</head>

<body>
    <header>
        <h1 id="movie-arafat">Movie Night</h1>
        <a href="index.html"><button class="nav-btn">Home</button></a>
        <a href="#popular"><button class="nav-btn">Popular</button></a>
        <a href="#top-rated"><button class="nav-btn">Top Rated</button></a>
        <a href="#upcoming"><button class="nav-btn">Upcoming</button></a>
    </header>
    <main>
        <section id="featured">
            <h2>Featured Tonight</h2>
            <div class="loader"></div>
        </section>
        <section class="movie-grid">
            <div class="card">
                <div class="poster"></div>
                <h3>Movie Night</h3>
                <p class="rating high">Rating like 8.1</p>

                <div class="card">
                <div class="poster"></div>
                <h3>Movie Day</h3>
                <p class="rating low">Rating like 3.6</p>

                <div class="card">
                <div class="poster"></div>
                <h3>Movie Noon</h3>
                <p class="rating medium">Rating like 5.0</p>

                <div class="card">
                <div class="poster"></div>
                <h3>Movie Afternoon</h3>
                <p class="rating six-seven">Rating like 6.7</p>
        </section>
    </main>
    </div>

</body>

</html>
